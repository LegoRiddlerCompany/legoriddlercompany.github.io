<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zagadka.pl</title>
    <link rel="stylesheet" href="/src/css/fonts.css">
    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/src/css/footer.css">
    <link rel="stylesheet" href="/src/css/window/window.css">
    <link rel="stylesheet" href="/src/css/window/skype.css">
    <link rel="stylesheet" href="/src/css/window/riddle.css">
    <link rel="stylesheet" href="/src/css/window/cheats.css">
    <link rel="stylesheet" href="/src/css/window/chat.css">
    <link rel="stylesheet" href="/src/css/window/folder.css">
    <link rel="stylesheet" href="/src/css/window/background.css">
    <link rel="stylesheet" href="/src/css/icon.css">
    <audio id="clickaudio" src="/assets/audio/click.mp3"></audio>
    <audio id="witamciebatmanieaudio" src="/assets/audio/witamciebatmanie.mp3"></audio>
    <audio id="clocktikaudio" src="/assets/audio/tik.mp3"></audio>
    <audio id="clocktakaudio" src="/assets/audio/tak.mp3"></audio>
    <audio id="callaudio" src="/assets/audio/skype.mp3" loop></audio>
    <script defer src="/src/js/global.js"></script>
    <script defer src="/src/js/riddleslist.js"></script>
    <script defer src="/src/js/App.js"></script>
    <script defer src="/src/js/WindowManager.js"></script>
    <script defer src="/src/js/audio.js"></script>
    <script defer src="/src/js/riddles.js"></script>
    <script defer src="/src/js/window.js"></script>
    <script defer src="/src/js/script.js"></script>
</head>

<body>
    <main>
        <div id="witam" class="icon-container">
            <a class="icon" href="javascript:void(0)" onclick="folder.open()"><img src="/assets/img/icon/folder.png"></a>
            <span class="icon-name">Witam Cię Batmanie!</span>
        </div>
        <div id="skype-icon" class="icon-container">
            <a class="icon" href="javascript:void(0)" onclick="skype.open()"><img src="/assets/img/icon/skype.png"></a>
            <span class="icon-name">Skype</span>
        </div>
        <div id="chat-icon" class="icon-container">
            <a class="icon" href="javascript:void(0)" onclick="chat.open()"><img src="/assets/img/icon/chat.png"></a>
            <span class="icon-name">Robin</span>
        </div>
        <div id="bgChange-icon" class="icon-container">
            <a class="icon" href="javascript:void(0)" onclick="bgChange.open()"><img src="/assets/img/icon/bgchange.png"></a>
            <span class="icon-name">Tapeta</span>
        </div>

        <div id="skype" class="window" hidden>
            <div class="title-bar">
                <div class="title-bar-name">
                    <div class="title-bar-icon-container"><img class="title-bar-icon" src="/assets/img/icon/riddle.png"></div>
                    <div class="title-bar-text">Skype</div>
                </div>
                <div class="title-bar-controls">
                    <button id="min-button" aria-label="Minimize" onclick="skype.minimize()"></button>
                    <button id="max-button" aria-label="Maximize" onclick="skype.maximize()"></button>
                    <button id="ext-button" aria-label="Close"    onclick="skype.close()"></button>
                </div>
            </div>
            <div class="window-body">
                <p>Tutaj bedzie rozmowa</p>
            </div>
        </div>

        <div id="folder" class="window" hidden>
            <div class="title-bar">
                <div class="title-bar-name">
                    <div class="title-bar-icon-container"><img class="title-bar-icon" src="/assets/img/icon/riddle.png"></div>
                    <div class="title-bar-text">Witam Cię Batmanie!</div>
                </div>
                <div class="title-bar-controls">
                    <button id="min-button" aria-label="Minimize" onclick="folder.minimize()"></button>
                    <button id="max-button" aria-label="Maximize" onclick="folder.maximize()"></button>
                    <button id="ext-button" aria-label="Close"    onclick="folder.close()"></button>
                </div>
            </div>
            <div id="folder-body" class="window-body">
            </div>
        </div>

        <div id="riddle" class="window" hidden>
            <div class="title-bar">
                <div class="title-bar-name">
                    <div class="title-bar-icon-container"><img class="title-bar-icon" src="/assets/img/icon/riddle.png"></div>
                    <div id="riddle-window-name" class="title-bar-text"></div>
                </div>
                <div class="title-bar-controls">
                    <button id="min-button" aria-label="Minimize" onclick="riddle.minimize()"></button>
                    <button id="max-button" aria-label="Maximize" onclick="riddle.maximize()"></button>
                    <button id="ext-button" aria-label="Close"    onclick="riddle.close()"></button>
                </div>
            </div>
            <div class="window-body">
                <p id="riddle-text"></p>
                <p id="riddle-hint" hidden></p>
                <form id="form" method="post">
                    <input type="text" maxlength="20" id="answer" name="answer" placeholder="Odpowiedź" required>
                    <button type="submit" onclick="clickSound()">Ok</button>
                </form>
                <p id="timer">10:00</p>
            </div>
        </div>

        <div id="chat" class="window" hidden>
            <div class="title-bar">
                <div class="title-bar-name">
                    <div class="title-bar-icon-container"><img class="title-bar-icon" src="/assets/img/icon/chat.png"></div>
                    <div class="title-bar-text">Robin</div>
                </div>
                <div class="title-bar-controls">
                    <button id="min-button" aria-label="Minimize" onclick="chat.minimize()"></button>
                    <button id="max-button" aria-label="Maximize" onclick="chat.maximize()"></button>
                    <button id="ext-button" aria-label="Close"    onclick="chat.close()"></button>
                </div>
            </div>
            <div class="window-body">
                <form id="key-form" method="post">
                    <input type="password" minlength="1" maxlength="40" id="cheats-input" name="input" placeholder="Wklej klucz" required>
                    <button type="submit" onclick="clickSound()">Ok</button>
                </form>
                <div id="chat-answer-container" hidden>
                    <p id="reset" class="chat-answer">Resetowanie klucza: <button id="key-reset" onclick="resetKey()">⟲</button><p>
                </div>
<!--                 <div id="chat-shadow"></div> -->
                <form id="chat-form" method="post" hidden>
                    <input type="text" minlength="1" id="cheats-input" name="input" placeholder="Pytanie do robina" required>
                    <button type="submit" onclick="clickSound()">></button>
                </form>
            </div>
        </div>

        <div id="cheats" class="window" hidden>
            <div class="title-bar">
                <div class="title-bar-name">
                    <div class="title-bar-icon-container"><img class="title-bar-icon" src="/assets/img/icon/riddle.png"></div>
                    <div class="title-bar-text">Cheats</div>
                </div>
                <div class="title-bar-controls">
                    <button id="min-button" aria-label="Minimize" onclick="cheats.minimize()"></button>
                    <button id="max-button" aria-label="Maximize" onclick="cheats.maximize()"></button>
                    <button id="ext-button" aria-label="Close"    onclick="cheats.minimize()"></button>
                </div>
            </div>
            <div class="window-body">
                <form id="cheats-form" method="post">
                    <input type="text" pattern="\d*" min="1" minlength="1" maxlength="3" id="cheats-input" name="input" placeholder="Numer zagadki" required>
                    <button type="submit" onclick="clickSound()">Ok</button>
                </form>
            </div>
        </div>

        <div id="background-change" class="window" hidden>
            <div class="title-bar">
                <div class="title-bar-name">
                    <div class="title-bar-icon-container"><img class="title-bar-icon" src="/assets/img/icon/bgchange.png"></div>
                    <div class="title-bar-text"></div>
                </div>
                <div class="title-bar-controls">
                    <button id="min-button" aria-label="Minimize" onclick="bgChange.minimize()"></button>
                    <button id="max-button" aria-label="Maximize" onclick="bgChange.maximize()"></button>
                    <button id="ext-button" aria-label="Close"    onclick="bgChange.close()"></button>
                </div>
            </div>
            <div class="window-body">
                <div class="background-controls-up">
                    <button id="background-prev" onclick="prevBackground()"><</button>
                    <button id="background-next" onclick="nextBackground()">></button>
                </div>
                <div class="background-controls-down">
                    <label class="checkbox-container" for="auto-background">
                        <input id="auto-background" class="checkbox-action" type="checkbox" onchange="setBackgroundAutoChange()" value="false">
                        <span class="checkbox-view"></span>
                        Pokaz Slajdów
                    </label>
                </div>
            </div>
        </div>

        <div id="volume" class="volume-container" hidden>
            <div class="field-row">
                <div class="is-vertical">
                    <input id="volume-value" class="has-box-indicator" type="range" min="1" max="10" step="1" value="10" />
                </div>
            </div>
        </div>
        <div id="skype-call" class="skype-call-container" hidden>
            <div class="skype-call-top">
                <span>Skype</span>
                <a href="javascript:void(0)"><span>x</span></a>
            </div>
            <div class="skype-call-bottom">
                <img src="/assets/img/riddler/skype-calling.webp">
                <div class="skype-call-text"><span>Dzwoni nieznany numer...</span></div>
                <div class="skype-call-right">
                    <div class="skype-call-space"></div>
                    <div class="skype-call-buttons-container">
                        <a class="skype-call-button" href="javascript:void(0)" onclick="answerCall(0)"><img src="/assets/img/window/answer.png"></a>
                        <a class="skype-call-button" href="javascript:void(0)" onclick="answerCall(1)"><img id="skype-call-decline-img" src="/assets/img/window/decline.png"></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="bar-left">
            <a id="bar-witamcie" class="bar-icon" href="javascript:void(0)" onclick="witamCieBatmanie()"><img src="/assets/img/icon/questionmark.png"></a>
<!--             <div class="divider"></div> -->
            <a id="bar-folder" class="bar-icon" href="javascript:void(0)" onclick="folder.toggle()" hidden><img src="/assets/img/icon/folder.png"></a>
            <a id="bar-chat" class="bar-icon" href="javascript:void(0)" onclick="chat.toggle()" hidden><img src="/assets/img/icon/chat.png"></a>
            <a id="bar-skype" class="bar-icon" href="javascript:void(0)" onclick="skype.toggle()" hidden><img src="/assets/img/icon/skype.png"></a>
            <a id="bar-riddle" class="bar-icon" href="javascript:void(0)" onclick="riddle.toggle()" hidden><img src="/assets/img/icon/riddle.png"></a>
            <a id="bar-background-change" class="bar-icon" href="javascript:void(0)" onclick="bgChange.toggle()" hidden><img src="/assets/img/icon/bgchange.png"></a>
        </div>
        <div class="bar-right">
            <a id="bar-cheats" class="bar-icon" href="javascript:void(0)" onclick="cheats.open()"><img src="/assets/img/icon/unlocked.png"></a>
            <a id="bar-volume" class="bar-icon" href="javascript:void(0)" onclick="volume.toggle()"><img src="/assets/img/icon/vol.png"></a>
            <p id="bar-time">18:00</p>
        </div>
    </footer>
</body>

</html>
